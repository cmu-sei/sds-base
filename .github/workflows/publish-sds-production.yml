name: Publish Production Package

on:
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-sds-common.yml
    with:
      channel: production
      checkout_ref: main
      validation_command: npm run dev:prepare && npm run lint --if-present && npm test --if-present && npm run build
