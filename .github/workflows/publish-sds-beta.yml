name: Publish Beta Package

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version component to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  repository_dispatch:
    types: [sds-beta-published]

jobs:
  publish:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish-sds-common.yml
    with:
      channel: beta
      checkout_ref: develop
      version_bump: ${{ inputs.version_bump || '' }}
      sds_previous_version: ${{ github.event.client_payload.sds_previous_version || '' }}
      sds_version: ${{ github.event.client_payload.sds_version || '' }}
      source_run: ${{ github.event.client_payload.source_run || '' }}
      validation_command: npm run dev:prepare && npm run lint --if-present && npm test --if-present && npm run build
