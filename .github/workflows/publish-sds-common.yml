name: Publish Package With Latest SDS

on:
  workflow_call:
    inputs:
      channel:
        description: SDS and package channel (production or beta)
        required: true
        type: string
      checkout_ref:
        description: Branch, tag, or commit to package
        required: true
        type: string
      version_bump:
        description: Semantic version component for a manual release
        required: false
        default: ''
        type: string
      sds_previous_version:
        description: Previous production SDS version for an automated release
        required: false
        default: ''
        type: string
      sds_version:
        description: Exact SDS version for an automated release
        required: false
        default: ''
        type: string
      source_run:
        description: Upstream SDS Actions run identifier
        required: false
        default: ''
        type: string
      validation_command:
        description: Command run before packaging
        required: false
        default: npm test --if-present && npm run build --if-present
        type: string

env:
  SDS_PACKAGE: '@cmu-sei/sei-design-system'
  REGISTRY_URL: 'https://npm.pkg.github.com'

concurrency:
  group: publish-sds-${{ github.repository }}-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Validate channel
        id: release
        env:
          CHANNEL: ${{ inputs.channel }}
          SDS_PREVIOUS_VERSION: ${{ inputs.sds_previous_version }}
          SDS_VERSION: ${{ inputs.sds_version }}
          SOURCE_RUN: ${{ inputs.source_run }}
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          test "$CHANNEL" = production -o "$CHANNEL" = beta

          if [ -n "$SDS_VERSION" ]; then
            test -n "$SDS_PREVIOUS_VERSION"
            test -n "$SOURCE_RUN"
            previous_core=$(npm exec --yes --package=semver -- semver "$SDS_PREVIOUS_VERSION")
            previous_core=${previous_core%%-*}
            previous_core=${previous_core%%+*}
            next_core=$(npm exec --yes --package=semver -- semver "$SDS_VERSION")
            next_core=${next_core%%-*}
            next_core=${next_core%%+*}
            npm exec --yes --package=semver -- semver "$next_core" -r ">$previous_core" >/dev/null

            previous_major=${previous_core%%.*}
            previous_minor_patch=${previous_core#*.}
            previous_minor=${previous_minor_patch%%.*}
            next_major=${next_core%%.*}
            next_minor_patch=${next_core#*.}
            next_minor=${next_minor_patch%%.*}

            if [ "$next_major" != "$previous_major" ]; then
              version_bump="major"
            elif [ "$next_minor" != "$previous_minor" ]; then
              version_bump="minor"
            else
              version_bump="patch"
            fi
          else
            test "$VERSION_BUMP" = patch -o "$VERSION_BUMP" = minor -o "$VERSION_BUMP" = major
            version_bump="$VERSION_BUMP"
          fi

          {
            echo "automated=$([ -n "$SDS_VERSION" ] && echo true || echo false)"
            echo "sds_version=$SDS_VERSION"
            echo "source_run=$SOURCE_RUN"
            echo "version_bump=$version_bump"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout package source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: ${{ env.REGISTRY_URL }}
          scope: '@cmu-sei'

      - name: Configure registries
        run: |
          npm config set registry https://registry.npmjs.org
          npm config set @cmu-sei:registry "$REGISTRY_URL"

      - name: Update to the latest SDS release
        id: sds
        env:
          CHANNEL: ${{ inputs.channel }}
          NODE_AUTH_TOKEN: ${{ github.token }}
          REQUESTED_SDS_VERSION: ${{ steps.release.outputs.sds_version }}
        run: |
          dist_tag=latest
          if [ "$CHANNEL" = beta ]; then
            dist_tag=beta
          fi

          latest="$REQUESTED_SDS_VERSION"
          if [ -z "$latest" ]; then
            latest=$(npm view "$SDS_PACKAGE" "dist-tags.$dist_tag" --registry="$REGISTRY_URL")
          else
            npm view "$SDS_PACKAGE@$latest" version --registry="$REGISTRY_URL" >/dev/null
          fi
          current=$(node -p "require('./package-lock.json').packages['node_modules/$SDS_PACKAGE'].version")
          if [ -n "$REQUESTED_SDS_VERSION" ] || npm exec --yes --package=semver -- semver "$latest" -r ">$current" --include-prerelease >/dev/null; then
            npm install --ignore-scripts --save-exact "$SDS_PACKAGE@$latest"
            changed=true
          else
            changed=false
          fi

          {
            echo "changed=$changed"
            echo "current=$current"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm ci --ignore-scripts

      - name: Check for an existing automated release
        id: existing
        env:
          AUTOMATED: ${{ steps.release.outputs.automated }}
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
          REQUESTED_SDS_VERSION: ${{ steps.release.outputs.sds_version }}
        run: |
          found=false
          if [ "$AUTOMATED" = true ]; then
            marker="SDS-Version: $REQUESTED_SDS_VERSION"
            if gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[].body // ""' | grep -Fxq "$marker"; then
              found=true
            fi

            package=$(node -p "require('./package.json').name")
            dist_tag=latest
            if [ "$CHANNEL" = beta ]; then
              dist_tag=beta
            fi
            published_sds=$(npm view "$package" "dist-tags.$dist_tag" --registry="$REGISTRY_URL" 2>/dev/null \
              | xargs -I{} npm view "$package@{}" "dependencies.$SDS_PACKAGE" --registry="$REGISTRY_URL" 2>/dev/null \
              || true)
            if [ "$published_sds" = "$REQUESTED_SDS_VERSION" ]; then
              found=true
            fi
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Set package version
        if: steps.existing.outputs.found != 'true'
        env:
          CHANNEL: ${{ inputs.channel }}
          NODE_AUTH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          SOURCE_RUN: ${{ steps.release.outputs.source_run }}
          VERSION_BUMP: ${{ steps.release.outputs.version_bump }}
        run: |
          package=$(node -p "require('./package.json').name")
          current=$(npm view "$package" dist-tags.latest --registry="$REGISTRY_URL" 2>/dev/null || true)
          if [ -z "$current" ]; then
            current=$(node -p "require('./package.json').version")
          fi
          version=$(npm exec --yes --package=semver -- semver "$current" -i "$VERSION_BUMP")
          if [ "$CHANNEL" = beta ]; then
            prerelease_id=$RUN_NUMBER
            if [ -n "$SOURCE_RUN" ]; then
              prerelease_id="sds.$SOURCE_RUN"
            fi
            version="$version-beta.$prerelease_id"
          fi
          npm version "$version" --no-git-tag-version

      - name: Validate package
        if: steps.existing.outputs.found != 'true'
        env:
          VALIDATION_COMMAND: ${{ inputs.validation_command }}
        run: bash -euo pipefail -c "$VALIDATION_COMMAND"

      - name: Check package version
        if: steps.existing.outputs.found != 'true'
        id: package
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          package=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$package@$version" version --registry="$REGISTRY_URL" >/dev/null 2>&1; then
            echo "Package $package@$version is already published." >&2
            exit 1
          fi
          {
            echo "name=$package"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Build package artifact
        if: steps.existing.outputs.found != 'true'
        id: pack
        run: |
          tarball=$(npm pack --ignore-scripts --json | node -e '
            let input = ""
            process.stdin.on("data", (chunk) => input += chunk)
            process.stdin.on("end", () => process.stdout.write(JSON.parse(input)[0].filename))
          ')
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Publish package
        if: steps.existing.outputs.found != 'true'
        env:
          CHANNEL: ${{ inputs.channel }}
          NODE_AUTH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          tag=latest
          if [ "$CHANNEL" = beta ]; then
            tag=beta
          fi
          npm publish "./$TARBALL" --ignore-scripts --tag "$tag"

      - name: Create GitHub release
        if: steps.existing.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          SDS_VERSION: ${{ steps.release.outputs.sds_version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          release_args=()
          if [ "$CHANNEL" = beta ]; then
            release_args+=(--prerelease)
          fi
          target=$(git rev-parse HEAD)
          release_args+=(--generate-notes)
          if [ -n "$SDS_VERSION" ]; then
            release_args+=(--notes "SDS-Version: $SDS_VERSION")
          fi
          gh release create "v$PACKAGE_VERSION" "./$TARBALL" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$target" \
            --title "$PACKAGE_NAME@$PACKAGE_VERSION" \
            "${release_args[@]}"

      - name: Summarize release
        if: steps.existing.outputs.found != 'true'
        env:
          CHANGED: ${{ steps.sds.outputs.changed }}
          CURRENT_SDS: ${{ steps.sds.outputs.current }}
          LATEST_SDS: ${{ steps.sds.outputs.latest }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          {
            echo "### Published $PACKAGE_NAME@$PACKAGE_VERSION"
            echo
            echo "SDS before run: $CURRENT_SDS"
            echo "SDS packaged: $LATEST_SDS"
            echo "SDS updated: $CHANGED"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize duplicate event
        if: steps.existing.outputs.found == 'true'
        env:
          SDS_VERSION: ${{ steps.release.outputs.sds_version }}
        run: echo "No release needed. The current channel already packages SDS $SDS_VERSION." >> "$GITHUB_STEP_SUMMARY"
